    <!-- Must match --color-paper in src/tokens.css (dark and light); a spec checks it. -->
    <meta name="theme-color" content="#0C0B12" />
    <script>
      document.documentElement.classList.add("js");
      try {
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.dataset.theme = "light";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#F5F4FA");
        }
      } catch (e) {}
    </script>
